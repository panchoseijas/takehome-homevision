[project]
name = "homevision"
version = "0.1.0"
description = "HTTP API that detects checkboxes in document images"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[project.scripts]
homevision-server = "homevision.server:main"
homevision-detect = "homevision.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homevision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside Starlette's test client, not by this project.
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
