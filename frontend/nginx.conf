server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's upload limit.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /detect {
        # Docker DNS keeps the proxy working if the backend is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
    }
}
