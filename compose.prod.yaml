# Live demo deployment: Caddy terminates TLS and routes each hostname to its service.
services:
  backend:
    build: ./backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps issued certificates across restarts.
      - caddy_data:/data
    depends_on:
      - frontend

volumes:
  caddy_data:
